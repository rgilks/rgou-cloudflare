version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript ESLint supports TypeScript <6.1; review 7.x after peer support lands.
      - dependency-name: typescript
        versions: ['>=7 <8']
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /worker/rust_ai_core
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /ml
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
